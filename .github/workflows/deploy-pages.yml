name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/goal-setting-WlWiQ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Add SPA + Jekyll bypass files
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      # Publishes the built site to the `gh-pages` branch on every push.
      # To make it public: GitHub repo → Settings → Pages → Source =
      # "Deploy from a branch" → Branch: gh-pages / (root) → Save.
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
